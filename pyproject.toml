[project]
name = "orbitcut"
version = "0.1.0"
description = "GoPro MTB footage pipeline — phase 0: ingest and inventory"
requires-python = ">=3.11"
dependencies = [
    "telemetrik>=0.1",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
]

[project.optional-dependencies]
sun = ["astral>=3.2"]

[project.scripts]
orbitcut = "orbitcut.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
